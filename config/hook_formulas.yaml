# Формулы заголовков/хуков (из сценаристского GPT). E-hook может опираться на меню.
- id: killers
  name: "Убийцы"
  pattern: "Что убивает / ломает привычное чтение X"
- id: myths
  name: "Мифы"
  pattern: "Миф: X. В кадре — Y"
- id: mistakes
  name: "Ошибки"
  pattern: "Ошибка смотреть на X как на Y"
- id: cannot
  name: "Нельзя"
  pattern: "Нельзя читать этот силуэт как…"
- id: wrong_how
  name: "Как неправильно"
  pattern: "Как неправильно объясняют происхождение X"
- id: cheap
  name: "За копейки / дёшево"
  pattern: "За копейки пересадили смысл — без новой формы"
- id: diy
  name: "Своими руками"
  pattern: "Своими руками: что убрали / что оставили"
- id: fast_cheap
  name: "Быстро / дёшево"
  pattern: "Быстрый ход: сменили полку, не силуэт"
- id: best_worst
  name: "Лучшие и худшие"
  pattern: "Лучший и худший кадр одной линии"
- id: what_doing
  name: "Что творит…"
  pattern: "Что творит с нами этот визуальный код"
- id: first_signs
  name: "Первые признаки"
  pattern: "Первый признак, что это не про то"
- id: cost
  name: "Стоимость"
  pattern: "Цена этого визуального решения"
- id: niche_trigger
  name: "Нишевые триггеры"
  pattern: "Триггер для дизайнеров / арт-директоров"
- id: clickbait
  name: "Провокация"
  pattern: "Дерзкий хук без вранья в факте"
- id: audience_address
  name: "Обращение к ЦА"
  pattern: "Если ты собираешь мудборд / смотришь референсы…"
- id: how_to
  name: "Как сделать"
  pattern: "Как читать этот кадр за 30 секунд"
