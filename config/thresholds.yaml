# Пороги и веса — в конфиг, не в код (см. EDIT-00 §7).
# До ~15-20 роликов это гипотеза; калибруется G1 на реальных отвалах.

retention:
  # E2: выше = хуже. passes=false если score >= threshold ИЛИ есть severity>=4
  dropoff_score_threshold: 40

material:
  # C1/C2: размеры пачек поиска
  web_results: 5
  image_results: 8
  # FIX-2: минимум картинок на каждое состояние A/B для freeze
  min_images_per_state: 3

scenario:
  # FIX-3: короче + отложенный payoff (механизм ≥55% длительности)
  target_duration_sec: 45
  min_duration_sec: 38
  max_duration_sec: 52
  meta_stop_phrases:
    - "странно, но"
    - "формула простая"
    - "заметь"
    - "через миг"
    - "на самом деле всё просто"
    - "а теперь представь"
    - "механизм:"
    - "формула:"
    - "в материале"
    - "в сниппете"
    - "как сказано"
    - "считывается как"

editorial:
  opening_variants_min: 5
  opening_variants_max: 8
  # E6 удалён (FIX-4); пороги оставлены на случай offline-утилит
  compress_min_ratio: 0.20
  compress_max_ratio: 0.25
  dropoff_score_threshold: 40
  attack_severity_block: 4

shots:
  # F1: сколько картинок на фразу
  images_per_phrase: 5

scoring:
  # B1: 5 осей (веха 5). G1 двигает weights по метрикам.
  weights:
    surprise: 1.0
    visuality: 1.0
    causal_clarity: 1.0
    evidence: 1.0
    shareability: 1.0

learning:
  # После стольких роликов hypothesis=false (пока ориентир)
  min_rollouts_for_calibration: 15
