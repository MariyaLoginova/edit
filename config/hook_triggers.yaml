# E-редактор выбирает один фактологический триггер, не выдумывает скандал.
- id: contradiction
  name: "Противоречие"
  use_when: "Привычное объяснение прямо ломается источником."
- id: forbidden_artifact
  name: "Запрещённый или невыпущенный артефакт"
  use_when: "Есть вещь, которую сделали, но не пустили в мир."
- id: number_reversal
  name: "Число, меняющее масштаб"
  use_when: "Цена, тираж, срок или количество переворачивают смысл."
- id: status_reversal
  name: "Статусный переворот"
  use_when: "То, что выглядит престижно, на деле служит другой цели."
- id: hidden_decision
  name: "Скрытое решение"
  use_when: "Известный результат объясняется одним конкретным выбором."
- id: personal_recognition
  name: "Личное узнавание"
  use_when: "Автор действительно может назвать момент, который её зацепил."
