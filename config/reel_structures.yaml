# Библиотека структур рилсов. E-editor выбирает ближайшую (или none).
# D2 получает полный пример выбранной структуры как ритм/биты.
# Источники: sources/reel-structures/*.pdf

- id: ostro_social
  name: "Остро-социальная тема"
  suits: "Болезненная/возмутительная история ЦА → ключевая мысль → что делать."
  beats:
    - триггерный заголовок / суть истории
    - история
    - вывод / ключевая мысль
    - как решить / что поможет
    - призыв к действию или вопрос зрителю
  full_example: |
    Триггер: «хочу уйти от мужа с тремя детьми, но некуда».
    История: 7 лет в браке, младшему 3 месяца; нет своего жилья; давление, оскорбления, контроль.
    Вывод: если хотите защитить детей — сначала защитите себя, начните зарабатывать.
    Решение: приходите на бесплатный марафон по финансовой независимости.
    CTA: подписывайся и следи, как подписчица достигает цели.
    Связка для визуальной ниши: та же боль → мысль про образ/стиль/кадр → конкретный разбор или вопрос.

- id: broad_pain
  name: "Широкая тема, которая волнует 9/10"
  suits: "Массовая боль/вопрос из комментов; узнавание → решение."
  beats:
    - проблема / вопрос ЦА
    - узнавание / эмоция
    - переход
    - решение
    - призыв или вопрос
  full_example: |
    Проблема: «хочешь снимать рилсы, но тебе стыдно, как ты выглядишь в кадре?»
    Узнавание: «я по три часа подбирала наряд и макияж, отчаивалась и не любила своё тело».
    Переход: «смотри, что с этим делать».
    Решение: объяснить по пунктам.
    CTA: читай продолжение в тг-канале.

- id: instrumental_q
  name: "Инструментальный вопрос"
  suits: "То, что ЦА гуглит/спрашивает: как сделать X → контекст → шаги."
  beats:
    - вопрос ЦА
    - контекст / ситуация
    - переход
    - решение по пунктам
    - призыв или бонус
  full_example: |
    Вопрос: «как понять, о чём снимать рилсы?»
    Контекст: «неделями думаю, о чём снять… ролики не дают результат, опускают руки».
    Переход: «смотри, что с этим делать».
    Решение: по пунктам.
    CTA: подарок по кодовому слову.

- id: magic_numbers
  name: "Магия чисел / перечисление"
  suits: "3 типа, 5 ошибок, уровни, порядок — мозг любит список с опорой."
  beats:
    - заявка числа/порядка
    - пункты с характером (не скучный список)
    - вывод / ударная мысль
    - вопрос или CTA
  full_example: |
    Тема: типы людей, которые не верят в психологию (3–5 типов).
    Сарказм: днём смеются над теми, кто ходит к психологу, ночью не могут уснуть от тревоги.
    Или: 5 ситуаций, где нужна сумка — но креативно (выгнали из дома / тёмный переулок…).
    Совмещение: «три уровня развития в инфо-бизе: начинающая, предприниматерь, инфо-милфа».

- id: character
  name: "Персонаж / ситуативка"
  suits: "Показать, не рассказать: собирательный неприятный клиент или типаж."
  beats:
    - ввод персонажа / ситуации
    - реплики и претензии персонажа
    - зеркало проблемы ЦА
    - вывод / удар
  full_example: |
    Воссоздать образ неприятного клиента ниши:
    дизайнер — вечно недовольный заказчик с миллионом правок;
    психолог — клиент-жертва «результат здесь и сейчас»;
    маркетолог — «нет бюджета, ты ж маркетолог, сделай магию».
    Собрать фразы из переписок → многогранный персонаж + юмор.

- id: hyperbole
  name: "Гиперболизация"
  suits: "Выкрутить знакомую проблему/образ до абсурда — основа сарказма."
  beats:
    - знакомая ситуация ЦА
    - раздувание деталей до абсурда
    - удар / узнавание
  full_example: |
    Тема из ниши клиента → раскрутить до вселенских масштабов.
    Наставник должен выглядеть МАКСИМАЛЬНО успешно: не одна сумка, а три;
    не макияж, а максимально праздничный макияж.
    Или: индивидуальный подход, выкрученный на максимум.

- id: new_context
  name: "Продукт / объект в новых условиях"
  suits: "Поставить вещь в абсурдный сегмент или нестандартные обстоятельства."
  beats:
    - обычный контекст объекта
    - неожиданный сегмент / обстоятельство
    - как «работает» там
    - вывод / вопрос
  full_example: |
    Таргет не для коммерции, а «как найти богатую милфу».
    Английский для эскортниц.
    Таро не на бывшего, а оценить машину при покупке.
    Суть: натянуть знакомый объект на аудиторию/ситуацию, куда обычно не смотрят.

- id: what_would_i
  name: "А что бы я сделал(а)…"
  suits: "Личный пошаговый план «с нуля» вместо абстрактных советов."
  beats:
    - «как бы я…»
    - 3–5 конкретных шагов
    - выгода / почему так
    - доказательство
    - вопрос или CTA
  full_example: |
    «Как бы я продала себя в качестве психолога, если бы начинала с нуля».
    1) 5 коротких роликов про боли клиентов.
    2) В шапке: «Помогаю выйти из тревожности за 4 недели».
    3) Бесплатная 20-мин консультация 5 новым подписчикам.
    Выгода: доверие и первые клиенты без рекламы.
    Док: скрин отзыва. CTA: напишите «Хочу».

- id: case_review
  name: "Рилс-обзор чужого успеха"
  suits: "Разбор кейса через контраст: добился X без обязательного ресурса Y."
  beats:
    - зацепка: как [герой] сделал [результат] без [ресурс]
    - обзор приёмов
    - вывод для аудитории
    - вопрос или CTA
  full_example: |
    «Как этот маркетолог заработал $1 млн, не потратив ни цента на рекламу».
    1) коллаборации вместо таргета;
    2) бесплатные интенсивы → база;
    3) продажи через цепочку писем.
    Вывод: масштабироваться можно через партнёрство, не только бюджет.

- id: myth_bust
  name: "Разрушение мифа"
  suits: "Популярное неверное убеждение → почему нет → как на самом деле."
  beats:
    - озвучить миф
    - кому смотреть
    - зачем досмотреть
    - разрушение + своя точка зрения
    - вопрос или CTA
  full_example: |
    Миф: «Ретроградный Меркурий — не период тотальной неудачи».
    Кому: тем, кто отменяет встречи и не подписывает договоры.
    Зачем: в конце — инструкция, как быть продуктивным и не винить звёзды.
    Разрушение: связан с пересмотром планов, но можно доделать проекты…
    Склонение: проверяй документы дважды — и период полезен.
    CTA: напишите «Меркурий» в комменты.

- id: historical
  name: "Исторический рилс"
  suits: "Провокационное утверждение → откуда пошло → ключевой приём эпохи."
  beats:
    - провокационное утверждение
    - история / откуда пошло
    - ключевое действие, которое это закрепило
    - что это меняет в чтении сейчас
    - вопрос зрителю
  full_example: |
    Утверждение: «Ты думаешь, идеальный пресс — это про здоровье? Нет, это маркетинг фитнес-индустрии».
    История: в 1980-х бренды столкнулись с падением продаж, мода на бодибилдинг уходит.
    Ключевое действие: продвижение образа «идеального тела» в журналах и ТВ — кубики как символ дисциплины и сексапила.
    Адаптация: создать яркий образ результата и связать с продуктом.
    CTA: подпишись — пришлю подборку приёмов.
