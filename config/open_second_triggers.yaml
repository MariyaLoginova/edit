# Триггеры первых 1.5–2 секунд (адапт нейромаркетинг-преролла под визуальный научпоп).
- id: curiosity
  name: "Любопытство"
  move: "Неожиданный кадр или вопрос без ответа в первой фразе"
- id: visual_shock
  name: "Визуальный шок / контраст"
  move: "Резкий контраст двух кадров или деталей"
- id: emotion_image
  name: "Эмоциональный образ"
  move: "Сразу чувство от кадра: бесит / залипаешь / стыдно смотреть"
- id: hyperbole
  name: "Гипербола"
  move: "Преувеличить деталь так, чтобы стала смешной или жёсткой"
- id: mystery
  name: "Тайна / недосказанность"
  move: "Начать с недосказанности — досмотреть ради разгадки"
- id: provocation
  name: "Провокация"
  move: "Задеть привычное мнение одним утверждением"
- id: recognition
  name: "Рефлекс узнавания"
  move: "Знакомый объект — чужое чтение"
- id: interact
  name: "Интерактив"
  move: "Выбор: А или Б? Спиздели или вдохновились?"
