# Методики сторителлинга (Фломастер + редактура канала).
# E-editor выбирает recommended_method; D2 получает весь объект, включая beats/example.
- id: bylo_stalo
  name: "Было / Стало"
  suits: "Визуал или объект, который менялся во времени."
  beats:
    - было: как выглядело / читалось раньше
    - стало: что изменилось в кадре
    - урок: что это меняет в чтении сейчас
  example: "Сравнение «до» и «после» не про прогресс ради прогресса — про то, как сменился допустимый силуэт."

- id: a_vot_nifiga
  name: "А вот нифига!"
  suits: "Очевидный вывод оказывается ложным; нужен переворот."
  beats:
    - привычная версия
    - удар фактом / кадром
    - как читать иначе
  example: "Все видят профессию. В кадре — разрешение на профессию."

- id: zhest_bol_happyend
  name: "Жесть. Боль. Happy End"
  suits: "Объект или приём прошёл через отвержение и вернулся."
  beats:
    - первая преграда / отвержение
    - личная или культурная борьба
    - возвращение / переворот смысла
  example: "Сначала форма выглядит «не той». Потом становится ясно, зачем её держали."

- id: kacheli
  name: "Эмоциональные качели"
  suits: "Сначала визуал отталкивает, затем захватывает — или наоборот."
  beats:
    - кризис / отторжение
    - эмоция зрителя
    - перелом и новая ставка
  example: "Сначала бесит. Потом не можешь отвести глаз — и понимаешь механизм."

- id: kak_delal
  name: "Как я это увидела"
  suits: "Личный путь к пониманию вещи, книги или приёма."
  beats:
    - конкретные шаги наблюдения
    - метод / что сравнивала
    - неожиданная трудность чтения
  example: "Не «как делать», а «как я разобрала кадр»: что смотрела первой."

- id: otkroy_dushu
  name: "Открой душу"
  suits: "Личная причина, почему визуал зацепил автора."
  beats:
    - кто я и зачем смотрю
    - эмоциональная привязка
    - интрига: дальше будет жёстче
  example: "Я слишком долго смотрела на эти перчатки — и вот почему."

- id: odna_detal
  name: "Одна деталь"
  suits: "Один незаметный факт меняет чтение всей истории."
  beats:
    - деталь крупным планом
    - привычное чтение
    - переворот от детали
  example: "Не костюм целиком — перчатки. Они выдают регистр."

- id: lozhnyy_sled
  name: "Ложный след"
  suits: "Зритель уверен, что знает объяснение, но источник ведёт в другое."
  beats:
    - ложная уверенность
    - улика против неё
    - настоящее объяснение
  example: "Кажется, что это про вдохновение девочек. Источник ведёт в другое."

- id: tsena_resheniya
  name: "Цена решения"
  suits: "Красивый продуктовый или визуальный ход имеет неожиданную цену."
  beats:
    - красивый ход
    - что за него заплатили
    - ставка для сегодня
  example: "Безопасный силуэт продаётся лучше — ценой честной грязи профессии."

- id: vizhu_tsel
  name: "Вижу цель — не вижу препятствий"
  suits: "Сразу ясная конечная точка чтения кадра, потом путь к ней."
  beats:
    - цель / финальный кадр смысла
    - почему это важно
    - что мешало увидеть сразу
  example: "Финиш: костюм = разрешение. Дальше — как к этому пришли."

- id: moya_dvizhuka
  name: "Моя движуха"
  suits: "Внутренняя мотивация разбора: зачем автору вообще это расковыривать."
  beats:
    - что двигает разбор
    - что хочет доказать
    - внутренний конфликт / сомнение
  example: "Меня бесит, когда «карьеру» рисуют без труда — вот зачем этот разбор."

- id: novyy_ya
  name: "Новый я / новая среда"
  suits: "Объект попал в чужой регистр и учится новым правилам полки."
  beats:
    - новая среда / полка
    - растерянность чтения
    - как адаптировали форму
  example: "Взрослый силуэт пересадили на детскую полку — и правила сменились."
