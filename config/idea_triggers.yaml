# Курированный банк углов из «100 идей для сториз/рилз» + видео-prompts.
# Только то, что ложится на визуальный научпоп-канал Марии.
# E-editor может взять selected_idea_trigger или none.

- id: old_new_photo
  name: "Было/стало кадра"
  angle: "Сравни старый и новый вид объекта: что изменилось внешне и в смысле."
  source: "100 идей · #8"

- id: book_insight
  name: "Инсайт из книги"
  angle: "Один конкретный инсайт из источника → что он меняет в чтении визуала."
  source: "100 идей · #22"

- id: trend_forecast
  name: "Тренд в нише"
  angle: "Что происходит с визуальным кодом сейчас и куда он ведёт."
  source: "100 идей · #47 + Трендолог GPT"

- id: case_breakdown
  name: "Разбор кейса"
  angle: "Взять одну вещь/серию и разобрать, как именно устроен кадр."
  source: "100 идей · #45"

- id: hard_problem
  name: "Сложная задача"
  angle: "Проблема чтения/производства визуала → как её разрулили."
  source: "100 идей · #46"

- id: beginner_mistakes
  name: "Ошибки в начале"
  angle: "Как неправильно читали объект раньше — и что вскрылось."
  source: "100 идей · #60"

- id: direct_faq
  name: "Частый вопрос"
  angle: "Развернутый ответ на типичный вопрос аудитории про визуал."
  source: "100 идей · #54"

- id: expert_day
  name: "День в профессии"
  angle: "Как выглядит рабочий взгляд на полку/референсы/архив."
  source: "100 идей · #49"

- id: detail_progress
  name: "Прогресс одной зоны"
  angle: "Одна линия эволюции детали (костюм, шрифт, упаковка)."
  source: "100 идей · #58"

- id: myth_series
  name: "Миф ниши"
  angle: "Популярный миф про дизайн/бренд → разрушение кадром."
  source: "100 идей · экспертный блок + myth_bust"

- id: newsjack_visual
  name: "Ньюсджек визуала"
  angle: "Быстрая реакция: свежий инфоповод → связать с историческим/архивным кадром."
  source: "Ньюз Джек GPT"

- id: shock_open
  name: "Шок-открытие 1.5с"
  angle: "Первый кадр — контраст/загадка; смысл раскрывается дальше."
  source: "Видео-prompts · преролл-триггеры"

- id: forbidden_list
  name: "Запрет / нельзя"
  angle: "Формат «запрещено читать так» — потом улика."
  source: "25 вирусных · Запрет"

- id: absurd_use
  name: "Абсурдное применение"
  angle: "Объект в нестандартных обстоятельствах (уже близко к new_context)."
  source: "25 вирусных · неожиданность"

- id: what_would_i_visual
  name: "Что бы я сделала"
  angle: "Личный план: как бы разобрала/пересобрала этот визуал с нуля."
  source: "100 идей · #2/#43 + what_would_i"

- id: values_in_work
  name: "Ценности в работе"
  angle: "Что важно в чтении кадра: точность детали, контекст, честность формы."
  source: "100 идей · #38"

- id: review_place_or_object
  name: "Обзор места/объекта"
  angle: "Музейная витрина, полка, архивный стенд — что там врёт подпись."
  source: "100 идей · #21"

- id: themed_shelf
  name: "Тематическая полка"
  angle: "Подборка из 3–5 визуалов одной линии с общим механизмом."
  source: "100 идей · #23"

- id: behind_process
  name: "Закулисье процесса"
  angle: "Как собирали доказательную линию: что искали, что отбросили."
  source: "100 идей · #83"

- id: objection_visual
  name: "Разбор возражения"
  angle: "«Это просто игрушка/мода» → ответить уликами из кадра."
  source: "100 идей · #86"
